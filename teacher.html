<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English E-mail Review - Teacher Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <style>
    :root { --primary: #4a90e2; --bg: #f8f9fa; --border: #e9ecef; }
    body { font-family: 'Pretendard', sans-serif; margin: 0; padding: 20px; background: var(--bg); color: #333; }
    .class-tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 2px solid var(--border); padding-bottom: 8px; overflow-x: auto; }
    .tab-btn { padding: 8px 16px; border: none; background: #e9ecef; border-radius: 20px; cursor: pointer; font-weight: bold; color: #495057; white-space: nowrap; }
    .tab-btn.active { background: var(--primary); color: white; }
    .student-chips-container { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; min-height: 50px; }
    .student-chip { padding: 8px 14px; background: white; border: 1px solid #ced4da; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; white-space: nowrap; user-select: none; }
    .student-chip.active { border-color: var(--primary); background: #eaf2fd; font-weight: bold; }
    .badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; }
    .badge.revised { background: #e6f4ea; color: #137333; }
    .badge.submitted { background: #feefc3; color: #b06000; }
    .main-view { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
    .panel { background: white; padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
    .panel-title { font-size: 16px; font-weight: bold; margin-bottom: 12px; color: #2c3e50; display: flex; justify-content: space-between; }
    .content-box { background: #f8f9fa; padding: 15px; border-radius: 8px; min-height: 200px; white-space: pre-wrap; font-size: 14px; line-height: 1.6; }
    .condition-list { display: flex; gap: 8px; margin-top: 10px; }
    .cond-tag { font-size: 12px; padding: 4px 8px; border-radius: 4px; background: #eee; }
    .cond-tag.pass { background: #e6f4ea; color: #137333; }
    .cond-tag.fail { background: #fce8e6; color: #c5221f; }
  </style>
</head>
<body>

<h1>🏫 교사 대시보드 (Realtime)</h1>

<div class="class-tabs">
  <button class="tab-btn active" onclick="filterClass('ALL')">전체보기</button>
  <button class="tab-btn" onclick="filterClass('21')">2학년 1반</button>
  <button class="tab-btn" onclick="filterClass('22')">2학년 2반</button>
  <button class="tab-btn" onclick="filterClass('23')">2학년 3반</button>
  <button class="tab-btn" onclick="filterClass('24')">2학년 4반</button>
  <button class="tab-btn" onclick="filterClass('25')">2학년 5반</button>
</div>

<div class="student-chips-container" id="studentChips"></div>

<div class="main-view">
  <div class="panel">
    <div class="panel-title"><span>📄 학생 원문</span></div>
    <div class="content-box" id="originalText">학생을 선택해 주세요.</div>
    <h4 style="margin-top:20px; margin-bottom:8px;">📊 AI 조건 체크</h4>
    <div class="condition-list" id="conditionTags"><span class="cond-tag">-</span></div>
  </div>

  <div class="panel">
    <div class="panel-title"><span>✏️ 학생 작성 수정본</span></div>
    <div class="content-box" id="revisionText">학생 수정본이 표출됩니다.</div>
  </div>
</div>

<script>
  // 🔗 Supabase 정보 입력 칸
  const SUPABASE_URL = 'https://dhprptwutteaudkpools.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRocHJwdHd1dHRlYXVka3Bvb2xzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMTQ0MDksImV4cCI6MjEwMzg5MDQwOX0.AThUkbpOkzB-IF_MzekPd0ulbWwm71Lmq2lWU1cXlkY';
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let allSubmissions = [];
  let currentClassFilter = 'ALL';
  let selectedStudentId = null;

  window.onload = async () => {
    await fetchInitialData();
    subscribeRealtime();
    new Sortable(document.getElementById('studentChips'), { animation: 150 });
  };

  async function fetchInitialData() {
    const { data } = await supabase.from('email_submissions').select('*').order('created_at', { ascending: true });
    if (data) { allSubmissions = data; renderChips(); }
  }

  function subscribeRealtime() {
    supabase.channel('public:email_submissions')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'email_submissions' }, payload => {
        allSubmissions.push(payload.new);
        renderChips();
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'email_submissions' }, payload => {
        const idx = allSubmissions.findIndex(s => s.id === payload.new.id);
        if (idx !== -1) {
          allSubmissions[idx] = payload.new;
          renderChips();
          if (selectedStudentId === payload.new.id) selectStudent(payload.new.id);
        }
      })
      .subscribe();
  }

  function filterClass(classCode) {
    currentClassFilter = classCode;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    renderChips();
  }

  function renderChips() {
    const container = document.getElementById('studentChips');
    container.innerHTML = '';

    const filtered = allSubmissions.filter(s => {
      if (currentClassFilter === 'ALL') return true;
      return s.student_info.trim().substring(0, 2) === currentClassFilter;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<span style="color:#888; font-size:13px; padding:8px;">제출 내역이 없습니다.</span>';
      return;
    }

    filtered.forEach(student => {
      const chip = document.createElement('div');
      chip.className = `student-chip ${student.id === selectedStudentId ? 'active' : ''}`;
      chip.onclick = () => selectStudent(student.id);
      const badge = student.status === 'revised' ? '<span class="badge revised">수정완료</span>' : '<span class="badge submitted">미수정</span>';
      chip.innerHTML = `<span>${student.student_info}</span> ${badge}`;
      container.appendChild(chip);
    });
  }

  function selectStudent(id) {
    selectedStudentId = id;
    renderChips();
    const student = allSubmissions.find(s => s.id === id);
    if (!student) return;

    document.getElementById('originalText').innerText = student.original_email;
    document.getElementById('revisionText').innerText = student.student_revision || "아직 수정본을 작성하지 않았습니다.";

    const feedback = student.ai_feedback || {};
    const toInf = feedback.summary?.to_infinitive;
    const conj = feedback.summary?.conjunction_effect;

    document.getElementById('conditionTags').innerHTML = `
      <span class="cond-tag ${toInf ? 'pass' : 'fail'}">to부정사: ${toInf ? '✅ 충족' : '❌ 미충족'}</span>
      <span class="cond-tag ${conj ? 'pass' : 'fail'}">접속사: ${conj ? '✅ 충족' : '❌ 미충족'}</span>
    `;
  }
</script>
</body>
</html>
