<script>
  // 🔗 Supabase 정보 입력 칸
  const SUPABASE_URL = 'dhprptwutteaudkpools';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRocHJwdHd1dHRlYXVka3Bvb2xzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMTQ0MDksImV4cCI6MjEwMzg5MDQwOX0.AThUkbpOkzB-IF_MzekPd0ulbWwm71Lmq2lWU1cXlkY';
  // ⭕ 아래처럼 변수명을 supabaseClient 로 변경합니다.
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); 

  let currentSubmissionId = null;
  let originalText = "";

  document.getElementById('emailForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const studentInfo = document.getElementById('studentInfo').value.trim();
    originalText = document.getElementById('emailContent').value.trim();

    document.getElementById('loading').style.display = 'block';
    document.getElementById('submitBtn').disabled = true;

    try {
      // 1. AI API 호출
      const res = await fetch('/api/review', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ studentInfo, emailContent: originalText })
      });
      const feedback = await res.json();

      // 2. Supabase DB에 저장 (supabaseClient 사용)
      const { data, error } = await supabaseClient
        .from('email_submissions')
        .insert([{
          student_info: studentInfo,
          original_email: originalText,
          ai_feedback: feedback,
          status: 'submitted'
        }])
        .select();

      if (error) throw error;

      currentSubmissionId = data[0].id;
      renderFeedback(feedback);
      document.getElementById('revisionSection').style.display = 'block';
    } catch (err) {
      alert("분석 또는 저장 중 오류가 발생했습니다. 입력한 글은 유지되니 다시 시도해주세요.");
      console.error(err);
    } finally {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('submitBtn').disabled = false;
    }
  });

  function renderFeedback(data) {
    const resDiv = document.getElementById('feedbackResult');
    resDiv.innerHTML = `
      <div class="card">
        <h2>📊 E-mail 점검 결과</h2>
        <p><b>표현:</b> ${data.summary?.register || '-'} | <b>일관성:</b> ${data.summary?.coherence || '-'} | <b>to부정사:</b> ${data.summary?.to_infinitive ? '✅' : '❌'} | <b>접속사:</b> ${data.summary?.conjunction_effect ? '✅' : '❌'}</p>
        <hr>
        <h4>💡 참고용 AI 수정 예시</h4>
        <pre style="white-space: pre-wrap; background: #fff; padding: 12px; border-radius: 6px;">${data.ai_revision_example || ''}</pre>
      </div>
    `;
  }

  function copyOriginalText() {
    document.getElementById('revisionContent').value = originalText;
  }

  async function saveRevision() {
    if (!currentSubmissionId) return;
    const revisionText = document.getElementById('revisionContent').value.trim();

    const { error } = await supabaseClient
      .from('email_submissions')
      .update({
        student_revision: revisionText,
        status: 'revised',
        updated_at: new Date()
      })
      .eq('id', currentSubmissionId);

    if (error) {
      alert("수정본 저장 실패!");
    } else {
      alert("수정본이 성공적으로 저장되었습니다!");
    }
  }
</script>
